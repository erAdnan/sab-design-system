<style>
  /* Full-viewport canvas so light/dark theme backgrounds fill the iframe. */
  html,
  body,
  #root,
  #storybook-root,
  #storybook-docs {
    width: 100% !important;
    max-width: 100% !important;
    min-height: 100% !important;
    height: 100% !important;
    overflow-x: hidden !important;
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
  }

  #storybook-root *,
  #storybook-docs * {
    box-sizing: border-box;
  }

  /* react-native-web roots often omit this; without it % widths misbehave. */
  #storybook-root > div {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    min-height: 100% !important;
    height: 100% !important;
  }

  /*
   * Story canvas: fill height for theme background, center story content
   * horizontally. Full-width components still stretch via width: 100% /
   * alignSelf: stretch on the component itself.
   */
  #storybook-root,
  #storybook-docs .docs-story {
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
    min-height: 100vh !important;
    height: 100% !important;
  }

  #storybook-root > div,
  #storybook-root > div > div {
    align-self: stretch !important;
    min-height: 100% !important;
  }

  /*
   * Kill the browser's default blue focus ring on form fields.
   * Component focus/active borders (theme.primClr etc.) still apply.
   */
  #storybook-root input,
  #storybook-root textarea,
  #storybook-root select,
  #storybook-root [contenteditable="true"],
  #storybook-docs input,
  #storybook-docs textarea,
  #storybook-docs select,
  #storybook-docs [contenteditable="true"] {
    outline: none !important;
    outline-color: transparent !important;
    outline-style: none !important;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
  }

  #storybook-root input:focus,
  #storybook-root input:focus-visible,
  #storybook-root input:active,
  #storybook-root textarea:focus,
  #storybook-root textarea:focus-visible,
  #storybook-root select:focus,
  #storybook-root select:focus-visible,
  #storybook-root [contenteditable="true"]:focus,
  #storybook-root [contenteditable="true"]:focus-visible,
  #storybook-docs input:focus,
  #storybook-docs input:focus-visible,
  #storybook-docs textarea:focus,
  #storybook-docs textarea:focus-visible,
  #storybook-docs select:focus,
  #storybook-docs select:focus-visible {
    outline: none !important;
    outline-color: transparent !important;
    outline-style: none !important;
    box-shadow: none !important;
    -webkit-box-shadow: none !important;
  }
</style>
